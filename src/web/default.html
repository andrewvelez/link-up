<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <title>Log in</title>
    <meta charset="utf-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181818">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="./icons/icon_24.png" type="image/png">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./external/pico.cyan.min.css">
    <link rel="stylesheet" href="./styles/global.css">
    <script src="./external/htmx.min.js"></script>
    <script type="module" src="./js/appInit.js"></script>
  </head>

  <body>
    <main id="app" class="container" tabindex="-1">
      <h1>Log in to Link-up</h1>
      <form aria-describedby="login-note">
        <fieldset disabled>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button type="button" disabled>Log in</button>
        </fieldset>
        <p id="login-note">Login is not available yet.</p>
      </form>
      <a href="./about.html">About Link-up</a>
    </main>
  </body>
</html>
