<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Link-Up Model–View–Adapter architecture</title>
  <desc id="desc">A user launches the Link-Up executable. App.js acts as the application object, composition root, and single-route front controller. It returns the embedded web/index.html through the BunWebUIAdapter to a browser or WebView. The JavaScript model and HTML view form the web application.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3f7"/>
    </linearGradient>
    <linearGradient id="application" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183b56"/>
      <stop offset="1" stop-color="#0f2c42"/>
    </linearGradient>
    <linearGradient id="view" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8f4"/>
      <stop offset="1" stop-color="#d7f0e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#244a64"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#16856f"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #5d7182; font-size: 20px; font-weight: 650; letter-spacing: 2px; }
      .title { fill: #102f46; font-size: 48px; font-weight: 760; }
      .subtitle { fill: #587083; font-size: 23px; }
      .boxTitle { fill: #13364f; font-size: 27px; font-weight: 740; }
      .boxBody { fill: #496477; font-size: 20px; }
      .small { fill: #62798a; font-size: 17px; }
      .whiteTitle { fill: #ffffff; font-size: 30px; font-weight: 760; }
      .whiteBody { fill: #dce8ef; font-size: 20px; }
      .arrowLabel { fill: #244a64; font-size: 18px; font-weight: 680; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <text x="90" y="86" class="label">LINK-UP ARCHITECTURE</text>
  <text x="90" y="145" class="title">Model–View–Adapter</text>
  <text x="90" y="184" class="subtitle">One executable launch request · one application route · one initial view response</text>

  <!-- User launch request -->
  <g filter="url(#shadow)">
    <rect x="110" y="245" width="220" height="310" rx="38" fill="#244a64"/>
  </g>
  <rect x="124" y="269" width="192" height="246" rx="24" fill="#ffffff"/>
  <rect x="184" y="255" width="72" height="7" rx="4" fill="#91aabc"/>
  <circle cx="275" cy="259" r="4" fill="#91aabc"/>
  <rect x="174" y="299" width="92" height="82" rx="21" fill="#dfeaf1"/>
  <path d="M220 360 V321 M204 337 L220 321 L236 337" fill="none" stroke="#244a64" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 354 V367 H242 V354" fill="none" stroke="#244a64" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="422" class="boxTitle" text-anchor="middle">User / OS</text>
  <text x="220" y="458" class="boxBody" text-anchor="middle">launches Link-Up</text>
  <text x="220" y="488" class="small" text-anchor="middle">the only request</text>
  <rect x="183" y="532" width="74" height="6" rx="3" fill="#91aabc"/>
  <text x="220" y="584" class="label" text-anchor="middle" font-size="16">OUTSIDE THE APP</text>

  <!-- Request arrow -->
  <path d="M330 405 H455" fill="none" stroke="#244a64" stroke-width="5" marker-end="url(#arrowNavy)"/>
  <text x="398" y="382" class="arrowLabel" text-anchor="middle">REQUEST</text>

  <!-- Application object -->
  <g filter="url(#shadow)">
    <rect x="475" y="255" width="425" height="300" rx="30" fill="url(#application)"/>
  </g>
  <rect x="510" y="291" width="120" height="38" rx="19" fill="#2c5e7d"/>
  <text x="570" y="317" fill="#eaf3f8" font-size="18" font-weight="700" text-anchor="middle">APPLICATION</text>
  <text x="520" y="378" class="whiteTitle">app.js</text>
  <text x="520" y="420" class="whiteBody">Application object</text>
  <line x1="520" y1="446" x2="855" y2="446" stroke="#44667d" stroke-width="2"/>
  <text x="520" y="483" class="whiteBody">Composition root</text>
  <text x="520" y="518" class="whiteBody">Single-route front controller</text>

  <!-- Response arrow -->
  <path d="M900 405 H1015" fill="none" stroke="#16856f" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text x="958" y="372" class="arrowLabel" text-anchor="middle">RESPONSE</text>
  <text x="958" y="398" class="small" text-anchor="middle">open(indexHtml)</text>

  <!-- Host adapter -->
  <g filter="url(#shadow)">
    <rect x="1035" y="255" width="475" height="300" rx="30" fill="#fff9e8" stroke="#e4c977" stroke-width="2"/>
  </g>
  <rect x="1070" y="291" width="112" height="38" rx="19" fill="#f0d98e"/>
  <text x="1126" y="317" fill="#654f12" font-size="18" font-weight="750" text-anchor="middle">ADAPTER</text>
  <text x="1070" y="378" class="boxTitle">BunWebUIAdapter</text>
  <text x="1070" y="421" class="boxBody">Presents the requested view</text>
  <text x="1070" y="456" class="boxBody">through Bun-WebUI</text>
  <line x1="1070" y1="482" x2="1470" y2="482" stroke="#e2cf90" stroke-width="2"/>
  <text x="1070" y="518" class="small">Host transport stays an implementation detail</text>

  <!-- Runtime panel -->
  <g filter="url(#shadow)">
    <rect x="90" y="650" width="1420" height="255" rx="30" fill="#ffffff" stroke="#cbd9e2" stroke-width="2"/>
  </g>
  <rect x="90" y="650" width="1420" height="66" rx="30" fill="#dfeaf1"/>
  <path d="M90 686 H1510 V716 H90 Z" fill="#dfeaf1"/>
  <circle cx="130" cy="683" r="8" fill="#d1665a"/>
  <circle cx="157" cy="683" r="8" fill="#d6a43b"/>
  <circle cx="184" cy="683" r="8" fill="#4ba87b"/>
  <text x="800" y="691" fill="#34566d" font-size="21" font-weight="720" text-anchor="middle">Browser / WebView — the UI runtime</text>

  <!-- Model -->
  <rect x="145" y="755" width="445" height="105" rx="20" fill="#edf3f7" stroke="#b9ccd8" stroke-width="2"/>
  <text x="180" y="798" class="boxTitle">MODEL</text>
  <text x="180" y="831" class="boxBody">JavaScript state · rules · workflows</text>

  <!-- Model/view connection -->
  <path d="M590 808 H735" fill="none" stroke="#16856f" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <path d="M735 832 H590" fill="none" stroke="#16856f" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="663" y="788" class="small" text-anchor="middle">interaction</text>

  <!-- View -->
  <rect x="755" y="755" width="690" height="105" rx="20" fill="url(#view)" stroke="#7cc6b5" stroke-width="2"/>
  <text x="790" y="798" fill="#126a58" font-size="27" font-weight="760">VIEW</text>
  <text x="790" y="831" class="boxBody">web/index.html · the one initial response</text>

  <!-- Lifecycle guide lines -->
  <path d="M688 555 V613 H800 V650" fill="none" stroke="#8299a8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="800" y="621" class="small" text-anchor="middle">application lifetime</text>
  <path d="M1273 555 V650" fill="none" stroke="#c6a94e" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Footer -->
  <text x="90" y="956" fill="#6a7f8e" font-size="18">The executable handles launch; app.js selects the only route; index.html is the view presented in response.</text>
</svg>
